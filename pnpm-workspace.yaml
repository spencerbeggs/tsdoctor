autoInstallPeers: true
configDependencies:
  "@effected/pnpm-plugin-effected": 0.24.0
  "@savvy-web/pnpm-plugin-silk": 0.52.0
minimumReleaseAgeExclude:
  - "@effected/pnpm-plugin-effected"
  - "@savvy-web/pnpm-plugin-silk"
packages:
  - modules/*
  - packages/*
  - platforms/*
  - plugin
  - sites/*
peerDependencyRules:
  allowedVersions:
    "@effected/bundler>typescript": "6"
    "@effected/plugin>typescript": "6"
