autoInstallPeers: true
configDependencies:
  "@effected/pnpm-plugin-effected": 0.26.0
  "@savvy-web/pnpm-plugin-silk": 0.53.0
minimumReleaseAgeExclude:
  - "@effected/pnpm-plugin-effected"
  - "@savvy-web/pnpm-plugin-silk"
  - "@rspack/*"
packages:
  - modules/*
  - packages/*
  - platforms/*
  - plugin
  - sites/*
peerDependencyRules:
  allowedVersions:
    "@effected/bundler>typescript": "6"
    "@effected/plugin>typescript": "6"
