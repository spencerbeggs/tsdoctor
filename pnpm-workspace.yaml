autoInstallPeers: true
configDependencies:
  "@effected/pnpm-plugin-effected": 0.20.0
  "@savvy-web/pnpm-plugin-silk": 0.51.3
minimumReleaseAgeExclude:
  - "@effected/pnpm-plugin-effected"
  - "@savvy-web/pnpm-plugin-silk"
packages:
  - modules/*
  - packages/*
  - platforms/*
  - plugin
  - sites/*
peerDependencyRules:
  allowedVersions:
    "@savvy-web/rspress-builder>typescript": "6"
    "@savvy-web/bundler>typescript": "6"
    "@savvy-web/bundler>satori": "0.63"
